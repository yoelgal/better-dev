name: checks
on:
  push:
    branches: [main, staging]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # prove-new diffs this ref against its base, and a default checkout is fetch-depth 1 -
          # the base commit simply is not in the clone, so the mode would have nothing to compare.
          fetch-depth: 0
      - name: git identity for selftests that commit in fixtures
        run: |
          git config --global user.email ci@better-dev.local
          git config --global user.name better-dev-ci
          git config --global init.defaultBranch main
      - name: repo root surface
        run: |
          jq -e . .claude-plugin/plugin.json >/dev/null
          dash="$(printf '\342\200\223\|\342\200\224')"
          if LC_ALL=C grep -n "$dash" README.md CLAUDE.md; then
            echo "em/en dash in a root doc - use a spaced hyphen" >&2; exit 1
          fi
      - name: package gate
        run: scripts/bd-package-check
      # A check that is green before the thing it guards exists proves nothing and reads exactly
      # like one that works. Every check this diff adds has to come back red against the base tree.
      - name: new checks must have been red before their implementation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1)"
          scripts/bd-package-check --prove-new "$base"
      - name: script and hook selftests
        run: |
          matched=0
          for s in scripts/bd-* hooks/bd-*; do
            [ -e "$s" ] || { echo "selftest glob matched nothing: $s" >&2; exit 1; }
            grep -q '"selftest"' "$s" || grep -q "selftest)" "$s" || continue
            matched=1
            echo "== $s selftest"; "$s" selftest
          done
          [ "$matched" = 1 ] || { echo "no selftest-bearing scripts found" >&2; exit 1; }
